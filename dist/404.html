<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>404 | Gonzalo Lobos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#eae7e2;color:#1a1816;font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;padding:24px}
    main{max-width:640px;margin:0 auto;border-top:10px solid #1a1816;padding-top:32px}
    .code{font-size:96px;font-weight:900;letter-spacing:-4px;line-height:1}
    .badge{display:inline-block;background:#0d9488;color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:13px;padding:6px 12px;margin:16px 0 24px}
    p{text-transform:uppercase;font-size:12px;letter-spacing:2px;line-height:1.7;margin-bottom:28px}
    nav{display:flex;gap:12px;flex-wrap:wrap}
    a{display:inline-block;background:#1a1816;color:#fff;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:12px;padding:14px 24px}
    a:hover{background:#0d9488}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="badge">Página no encontrada / Page not found</div>
    <p>La URL no existe. Vuelve al portafolio.<br>This URL does not exist. Go back to the portfolio.</p>
    <nav>
      <a href="/es" hreflang="es">Ir al portafolio (ES)</a>
      <a href="/en" hreflang="en">Go to portfolio (EN)</a>
    </nav>
  </main>
</body>
</html>
